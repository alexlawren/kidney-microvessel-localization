[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kidney-vessels"
version = "0.1.0"
description = "Аудит гистологических изображений почек и исходной сосудистой разметки"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow>=11.1,<13", "shapely>=2.1,<3"]

[project.scripts]
kidney-vessels = "kidney_vessels.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-shapely>=2.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/kidney_vessels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
